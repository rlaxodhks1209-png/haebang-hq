<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>해방 HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 위 상태판 + 명령줄, 가운데 픽셀 사무실(캔버스), 아래 선택한 직원·부서 카드와 실장 답변 */
:root{
  --bg:#efe6da; --panel:#fffaf2; --ink:#2a1b16; --muted:#7a675b; --line:#e2d3c1;
  --accent:#b8323f; --accent-ink:#fffaf2; --gold:#d79a2b;
  --display:"Do Hyeon","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17110f;--panel:#231a16;--ink:#f3e6d8;--muted:#b6a090;--line:#3a2b24;--accent:#e4697a;--accent-ink:#1b120f;--gold:#e8b45a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17110f;--panel:#231a16;--ink:#f3e6d8;--muted:#b6a090;--line:#3a2b24;--accent:#e4697a;--accent-ink:#1b120f;--gold:#e8b45a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1240px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
.hud{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.brand{font-family:var(--display);font-size:28px;margin-right:auto;line-height:1}
.brand small{font-family:var(--body);font-size:12px;color:var(--muted);margin-left:8px}
.pill{background:var(--panel);border:2px solid var(--ink);border-radius:12px;padding:6px 14px;font-family:var(--display);font-size:22px;box-shadow:0 3px 0 var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{color:var(--accent);font-weight:400}
.cmd{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--ink);border-radius:12px;padding:4px 6px 4px 14px}
.cmd span{font-family:var(--display);font-size:22px;color:var(--accent)}
.cmd input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-family:var(--display);font-size:20px;padding:8px 0;outline:none}
.cmd button{border:2px solid var(--ink);background:var(--gold);color:#2a1b16;border-radius:8px;font-family:var(--display);font-size:18px;padding:4px 12px;cursor:pointer}
.cmd:focus-within{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:4px 11px;font:inherit;font-size:13px;cursor:pointer}
.chips button:hover{border-color:var(--accent)}
.stage{overflow-x:auto;border-radius:14px;border:4px solid #1d1418;background:#1d1418}
canvas{display:block;width:100%;min-width:900px;height:auto;image-rendering:pixelated;cursor:pointer}
.hint{font-size:12.5px;color:var(--muted)}
.below{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.below{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-family:var(--body);font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--line);color:var(--ink)}
.badge.new{background:#dbe9fb;color:#2c5b9c}.badge.ok{background:#d8efe0;color:#246b43}.badge.wait{background:#f8e5c6;color:#8a5414}.badge.off{background:#e9e3de;color:#6f645d}
.kv{display:grid;grid-template-columns:76px 1fr;gap:4px 10px;margin:0;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.log{display:grid;gap:8px;max-height:260px;overflow:auto}
.msg{font-size:14px;padding:8px 12px;border-radius:12px;max-width:92%}
.msg.me{justify-self:end;background:var(--ink);color:var(--bg)}
.msg.ai{background:color-mix(in srgb,var(--gold) 22%,var(--panel));border:1px solid var(--line)}
.msg.ai b{display:block;font-size:12px;color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<style>
.gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#1d1418;padding:16px}
.gate form{background:#2b1f2c;border:3px solid #d79a2b;border-radius:16px;padding:28px 24px;display:grid;gap:14px;width:min(340px,100%);text-align:center;color:#ffe7c4;font-family:"Do Hyeon","Noto Sans KR",sans-serif}
.gate h1{margin:0;font-size:34px;font-weight:400}
.gate p{margin:0;font-family:"Noto Sans KR",sans-serif;font-size:14px;color:#d9c4b0}
.gate input{font:inherit;font-size:28px;letter-spacing:.4em;text-align:center;padding:10px;border-radius:10px;border:2px solid #d79a2b;background:#1d1418;color:#ffe7c4}
.gate button{font:inherit;font-size:20px;padding:10px;border-radius:10px;border:0;background:#d79a2b;color:#2a1b16;cursor:pointer}
.gate .err{color:#ff9a9a;min-height:1.2em}
</style>
</head>

<div class="gate" id="gate"><form id="gateForm" autocomplete="off">
<h1>해방 HQ</h1><p>사장님 비밀번호 4자리를 넣어 주세요</p>
<input id="pin" type="password" inputmode="numeric" maxlength="4" aria-label="비밀번호 4자리" autofocus>
<button type="submit">출근하기</button><p class="err" id="err"></p></form></div>
<div id="app" hidden>
<div class="wrap">
  <div class="hud">
    <div class="brand">해방 HQ<small>해방 혼술바 · AI 직원 사무실</small></div>
    <span class="pill">출근 <b id="inCount">0명</b></span>
    <span class="pill">월급 <b>₩0</b></span>
    <span class="pill" id="clockPill">--:--</span>
  </div>
  <form class="cmd" id="cmd" autocomplete="off">
    <span aria-hidden="true">&gt;</span>
    <input id="cmdIn" placeholder="오늘 출근 현황 알려줘" aria-label="실장에게 말하기">
    <button type="submit">↵</button>
  </form>
  <div class="chips" id="chips"></div>
  <div class="stage"><canvas id="cv" width="1200" height="1475" aria-label="해방 HQ 사무실. 직원이나 부서를 누르면 아래에 자세히 나와요."></canvas></div>
  <div class="hint">직원이나 부서를 누르면 아래에 자세히 나와요. 휴대폰에서는 사무실을 옆으로 밀어서 보세요.</div>
  <div class="below">
    <section class="card" id="info" aria-live="polite"></section>
    <section class="card"><h2>실장 보고</h2><div class="log" id="log"></div></section>
  </div>
</div>

</div>

 if(!reduce){if(walkers.length<4&&t>nextWalk){startWalk();nextWalk=t+1800+rnd()*2500}walkers.slice().forEach(w=>stepWalk(w,dt));if(t>nextBub){rotateBubbles();nextBub=t+3200;chiefLine=(chiefLine+1)%CHIEF_LINES.length}}
 draw(t);requestAnimationFrame(loop)}
rotateBubbles();
(document.fonts&&document.fonts.load?Promise.all([document.fonts.load('17px "Do Hyeon"'),document.fonts.load('14px "Noto Sans KR"')]).catch(()=>{}):Promise.resolve()).then(()=>{drawBG();requestAnimationFrame(loop)});

// ── 클릭 ──
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener("click",e=>{const {x,y}=pt(e);
 const wp=people.find(p=>!p.empty&&p.mode==="walk"&&x>=p.x-6&&x<=p.x+36&&y>=p.y-6&&y<=p.y+60);
 const dp=desks.find(({dx,dy})=>x>=dx-4&&x<=dx+68&&y>=dy-56&&y<=dy+50);
 if(wp)select({kind:"person",p:wp});else if(dp&&!dp.p.empty)select({kind:"person",p:dp.p});
 else{const d=DEPTS.find(d=>x>=d.x&&x<=d.x+d.w&&y>=d.y-12&&y<=d.y+d.h);if(d)select({kind:"dept",d})}});
const info=document.getElementById("info");
const el=(t,c,s)=>{const e=document.createElement(t);if(c)e.className=c;if(s!=null)e.textContent=s;return e};
const ST={ok:["끝남","ok"],wait:["기다리는 중","wait"],new:["신입 · 준비 중","new"],work:["첫 업무 중","new"],off:["쉬는 중","off"]};
function select(s){sel=s;info.textContent="";
 if(s.kind==="person"){const p=s.p;const h=el("h2",null,p.name+" "+p.rank);const st=ST[p.st]||ST.ok;h.append(el("span","badge "+st[1],st[0]));
  const dl=el("dl","kv");const d=DEPTS.find(x=>x.id===p.dept);[["부서",d.name],["맡은 일",p.job]].concat(p.task?[["첫 업무",p.task]]:[]).concat([["상태",p.out]]).forEach(([k,v])=>{dl.append(el("dt",null,k),el("dd",null,v))});info.append(h,dl)}
 else{const d=s.d;const h=el("h2",null,d.name);h.append(el("span","badge "+d.st[1],d.st[0]));const n=people.filter(p=>p.dept===d.id&&!p.empty).length,e2=people.filter(p=>p.dept===d.id&&p.empty&&!p.boss).length;
  const dl=el("dl","kv");[["하는 일",d.about],["인원",n+"명"+(e2?" · 빈 책상 "+e2+"개":"")]].forEach(([k,v])=>{dl.append(el("dt",null,k),el("dd",null,v))});info.append(h,dl);
  if(d.id==="sogaeting"){const p=el("p",null,"개발 12 · 기획 8 · 보안 6 · 출시 4명. 책상 불빛: 초록 끝남, 노랑 기다리는 중, 파랑 첫 업무 중, 회색 쉬는 중.");p.style.cssText="margin:8px 0 0;font-size:13px;color:var(--muted)";info.append(p)}}}
select({kind:"dept",d:DEPTS[0]});

// ── 시계 ──
const clk=document.getElementById("clockPill");const tick=()=>{try{clk.textContent=new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Seoul"})}catch(e){}};tick();setInterval(tick,20000);

// ── 실장에게 말하기 ──
const log=document.getElementById("log");
const cnt=id=>people.filter(p=>p.dept===id&&!p.empty).length;
const ANS=[
 [/출근|현황|몇 ?명|인원/,()=>"오늘 출근 "+staff.length+"명이에요! 소개팅 "+cnt("sogaeting")+" · 블로그 "+cnt("blog")+" · 릴스 "+cnt("reels")+" · 쓰레드 "+cnt("threads")+" · 정산 "+cnt("sales")+" · 플레이앱 "+cnt("play")+" · 경영지원 "+cnt("exec")+"명(저 포함). 새로 온 70명도 첫 업무를 받아서 일하는 중이에요.","sogaeting"],
 [/참가비|가격|요금|비용/,()=>"소개팅 참가비는 29,900원이에요(칵테일 1잔 포함). 한 번에 최대 12명, 한 달에 두 번 정도 열어요.","sogaeting"],
 [/소개팅|로테이션/,()=>"소개팅 사이트는 다 만들었어요. 자동 검사 311개, 손님 흐름 시험 53개 통과했고요. 배포 담당이 힉스필드로 올릴 준비를 하고 있어요. 그 전까지는 구글 설문지로 받아요.","sogaeting"],
 [/블로그/,()=>"블로그팀 15명 첫 업무: 첫 3편(매장 소개 → 시그니처 칵테일 → 로테이션 소개팅 안내) 초안, 검색어 20개, 월·수·금 예약 달력. 매장 사진만 주시면 바로 붙여요.","blog"],
 [/릴스|영상/,()=>"릴스팀 15명 첫 업무: 30초 매장 소개 대본과 촬영 콘티 6컷, 배경음 후보, 힉스필드 아바타 요청문. 매장에서 찍은 영상을 주시면 편집 들어가요.","reels"],
 [/쓰레드/,()=>"쓰레드팀 10명은 ‘혼술바 바텐더의 하루’ 방향으로 주 5회, 밤 9시에 올려요. 첫 업무로 글 10개 초안 쓰는 중이에요.","threads"],
 [/정산|매출/,()=>"정산팀 10명은 매일 매출 일지(카드·현금·이체·소개팅 참가비)와 월간 정산표 틀을 만들어요. 포스기 내역을 주시면 바로 채워요.","sales"],
 [/플레이|앱/,()=>"플레이앱팀 12명의 첫 앱은 ‘나에게 맞는 칵테일 찾기’ 테스트예요. 질문 10개로 칵테일을 추천하고, 인스타 링크로 먼저 내보내요.","play"],
 [/목표|이번 ?주|칠판/,()=>"이번 주 목표는 칠판에 적어 둔 세 가지예요. 소개팅 사이트 인터넷에 올리기, 블로그 주 3편, 릴스 첫 편(매장 소개). 아직 셋 다 진행 중이에요.","exec"],
 [/점검|고쳐|고치|작업실|HQ/i,()=>"이 사무실은 4시간마다 제가 한 번씩 둘러보고, 고칠 곳이 있으면 하나씩 고쳐요. 크게 바꿀 일은 대표님께 먼저 여쭤볼게요.","exec"],
 [/할 ?일|해야/,()=>"대표님 할 일은 자료 보내 주시기예요. 블로그·릴스는 매장 사진과 영상, 정산은 포스기 매출 내역이요. 그러면 각 팀이 바로 결과를 만들어요.","exec"],
 [/월급|돈|급여/,()=>"100명인데 월급은 ₩0이에요. 대신 일을 많이 주세요!","exec"],
 [/채용|뽑|100/,()=>"인사 과장이 100명 채용을 끝냈어요. 새로 온 사람들은 파란 불빛 책상이에요.","exec"],
 [/안녕|하이|ㅎㅇ/,()=>"대표님 오셨어요! 무엇을 보고드릴까요?","exec"]];
function say(q){if(!q.trim())return;log.append(el("div","msg me",q));
 const hit=ANS.find(([re])=>re.test(q));const a=hit?hit[1]():"아직 그 말은 못 알아들어요. ‘출근’, ‘소개팅’, ‘블로그’, ‘할 일’처럼 물어봐 주세요.";
 const m=el("div","msg ai");m.append(el("b",null,"AI 실장"),document.createTextNode(a));log.append(m);log.scrollTop=log.scrollHeight;
 chiefOverride=a.length>18?a.slice(0,17)+"…":a;chiefUntil=performance.now()+5000;
 if(hit){const d=DEPTS.find(x=>x.id===hit[2]);if(d)select({kind:"dept",d})}}
document.getElementById("cmd").addEventListener("submit",e=>{e.preventDefault();const i=document.getElementById("cmdIn");say(i.value||i.placeholder);i.value=""});
const chips=document.getElementById("chips");["오늘 출근 현황 알려줘","소개팅 어디까지 됐어?","오늘 내 할 일","블로그는?","이번 주 목표는?","월급 얼마야?"].forEach(q=>{const b=el("button",null,q);b.type="button";b.addEventListener("click",()=>say(q));chips.append(b)});
say("오늘 출근 현황 알려줘");
}

<script>
(function(){
var H="224c310023e8bed291be5b585f26eb98f2aee7e8ee2f245a03999037a340f546";
async function hash(v){var d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("haebang-hq:"+v));return Array.from(new Uint8Array(d)).map(function(b){return b.toString(16).padStart(2,"0")}).join("")}
function open(){document.getElementById("gate").remove();document.getElementById("app").hidden=false;startHQ()}
var ok=false;try{ok=sessionStorage.getItem("hb-hq")==="1"}catch(e){}
if(ok){open();return}
document.getElementById("gateForm").addEventListener("submit",async function(e){e.preventDefault();var v=document.getElementById("pin").value.trim();
 if(await hash(v)===H){try{sessionStorage.setItem("hb-hq","1")}catch(e){}open()}else{document.getElementById("err").textContent="비밀번호가 달라요";document.getElementById("pin").value=""}});
})();
</script>
